# Go-only public topology.
#
# Use with docker-compose.yml and the existing protected env file.  The Go
# binary embeds the web UI, so nginx keeps its existing upstream name through
# a network alias while the Node platform, browser worker, and old Shuihuo
# compatibility service are all opt-in legacy profiles.

services:
  go-api:
    # Keep the existing Nginx upstream name/port working while the upstream
    # process itself is the native Go API.
    expose:
      - "3000"
    environment:
      QIANTIE_GO_LISTEN_ADDR: ":3000"
      QIANTIE_PRESET_PATH: /app/data/system/presets.json
      QIANTIE_PERSONAL_PROMPT_PATH: /app/data/system/script-constraint-prompts.json
      QIANTIE_BATCH_FACTORY_AUTOMATION_PRESETS_PATH: /app/data/batch-factory-v11-automation-presets.json
      QIANTIE_BATCH_FACTORY_AUTOMATION_STATE_PATH: /app/data/batch-factory-v11-automation.json
      QIANTIE_SCRIPT_HISTORY_DIR: /app/data/users
      QIANTIE_MEMBER_SYSTEM_DIR: /app/data/system
      QIANTIE_MEMBER_AVATAR_DIR: /app/data/avatars
      QIANTIE_LOCAL_EXECUTOR_DOWNLOADS_DIR: /app/data/downloads
    volumes:
      - v88_data:/app/data
      - go_api_artifacts:/data/local-executor-artifacts
    networks:
      qiantie_internal:
        aliases:
          - v88-node

  browser-worker:
    profiles: ["node-legacy"]

  shuihuo-compat:
    profiles: ["node-legacy"]

  v88-node:
    profiles: ["node-legacy"]

  nginx:
    # Replace the legacy dependency map with a Go-only dependency list. The
    # existing nginx upstream name is still resolved through go-api's alias.
    depends_on: !override
      - go-api

volumes:
  v88_data:
    external: true
    name: v88-public_v88_data
  go_api_artifacts:
    external: true
    name: v88-public_go_api_artifacts
