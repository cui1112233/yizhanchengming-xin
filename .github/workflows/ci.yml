name: ci

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:

jobs:
  go-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - run: go test ./...
      - run: go build ./...

  goose-migration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: task10
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Install Goose compatible with Go 1.23
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.24.3

      # A. Clean-database path: final branch from zero -> latest -> rollback.
      - name: Apply Goose migrations on clean database
        run: goose -dir db/migrations mysql 'root:root@tcp(127.0.0.1:3306)/task10?parseTime=true&multiStatements=true' up
      - name: Verify MySQL settings survive reload
        env:
          TASK10_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/task10?parseTime=true
        run: go test ./internal/unifiedsettings -run TestMySQLPersistenceSurvivesStoreReload -count=1
      - name: Verify publishing transaction rollback and retry
        env:
          TASK15_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/task10?parseTime=true
        run: go test ./internal/publishing -run TestMySQLTransactionsRollbackAndRetry -count=1
      - name: Verify Task14 video tasks survive service restart
        env:
          TASK14_INTEGRATION_DSN: root:root@tcp(127.0.0.1:3306)/task10?parseTime=true
        run: go test ./internal/video -run TestMySQLRestartRecoveryIntegration -count=1
      - name: Verify clean database Goose status includes Task14 00007
        run: |
          goose -dir db/migrations mysql 'root:root@tcp(127.0.0.1:3306)/task10?parseTime=true&multiStatements=true' status 2>&1 | tee /tmp/task14-clean-status.txt
          grep -q '00007_task14_video.sql' /tmp/task14-clean-status.txt
      - name: Verify clean database Goose rollback
        run: goose -dir db/migrations mysql 'root:root@tcp(127.0.0.1:3306)/task10?parseTime=true&multiStatements=true' down-to 0

      # B. Real upgrade path: current main (00001/2/3/4/6) -> final Task14 00007.
      - name: Snapshot current main migrations
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          rm -rf /tmp/task14-main
          mkdir -p /tmp/task14-main
          git archive origin/main api/db/migrations | tar -x -C /tmp/task14-main
          test -f /tmp/task14-main/api/db/migrations/00004_task15_auth.sql
          test -f /tmp/task14-main/api/db/migrations/00006_task13_match_audio.sql
          test ! -f /tmp/task14-main/api/db/migrations/00007_task14_video.sql
      - name: Apply current main migrations first
        run: goose -dir /tmp/task14-main/api/db/migrations mysql 'root:root@tcp(127.0.0.1:3306)/task10?parseTime=true&multiStatements=true' up
      - name: Verify existing-main database is at Task13/Task15 state
        run: |
          goose -dir /tmp/task14-main/api/db/migrations mysql 'root:root@tcp(127.0.0.1:3306)/task10?parseTime=true&multiStatements=true' status 2>&1 | tee /tmp/task14-main-status.txt
          grep -q '00004_task15_auth.sql' /tmp/task14-main-status.txt
          grep -q '00006_task13_match_audio.sql' /tmp/task14-main-status.txt
      - name: Upgrade existing-main database with Task14 00007
        run: goose -dir db/migrations mysql 'root:root@tcp(127.0.0.1:3306)/task10?parseTime=true&multiStatements=true' up
      - name: Verify existing-main upgrade appended Task14 00007
        run: |
          goose -dir db/migrations mysql 'root:root@tcp(127.0.0.1:3306)/task10?parseTime=true&multiStatements=true' status 2>&1 | tee /tmp/task14-upgrade-status.txt
          grep -q '00004_task15_auth.sql' /tmp/task14-upgrade-status.txt
          grep -q '00006_task13_match_audio.sql' /tmp/task14-upgrade-status.txt
          grep -q '00007_task14_video.sql' /tmp/task14-upgrade-status.txt
      - name: Verify Task14 restart recovery after existing-main upgrade
        env:
          TASK14_INTEGRATION_DSN: root:root@tcp(127.0.0.1:3306)/task10?parseTime=true
        run: go test ./internal/video -run TestMySQLRestartRecoveryIntegration -count=1
      - name: Verify upgraded database Goose rollback
        run: goose -dir db/migrations mysql 'root:root@tcp(127.0.0.1:3306)/task10?parseTime=true&multiStatements=true' down-to 0

  task10-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify legacy parse-input entry is not user reachable
        shell: bash
        run: |
          if grep -RInE --exclude='*.test.*' --exclude-dir=node_modules '解析输入|parse[-_ ]?input' '前台/src'; then
            echo 'Legacy parse-input entry remains in frontend source.'
            exit 1
          fi
      - name: Verify AI copy controls have one frontend owner
        shell: bash
        run: |
          mapfile -t owners < <(grep -RIlE --exclude='*.test.*' --exclude-dir=node_modules 'aiCopyEnabled|aiCopyCount' '前台/src' || true)
          if [ "${#owners[@]}" -ne 1 ] || [ "${owners[0]}" != '前台/src/UnifiedSettingsPanel.jsx' ]; then
            printf 'Unexpected AI copy control owners: %s\n' "${owners[*]}"
            exit 1
          fi
      - name: Verify Task 10 does not use LocalStorage as config source
        shell: bash
        run: |
          if grep -In 'localStorage' '前台/src/UnifiedSettingsPanel.jsx' '前台/src/api.js'; then
            echo 'Task 10 frontend must use Go API/MySQL, not LocalStorage.'
            exit 1
          fi
      - name: Verify duplicate legacy AI copy labels are absent
        shell: bash
        run: |
          if grep -RInE --exclude='*.test.*' --exclude-dir=node_modules '默认 AI 文案数量|AI ?文案处理优先方案' '前台/src'; then
            echo 'Duplicate legacy AI copy settings remain.'
            exit 1
          fi

  admin-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: '后台'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build

  user-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: '前台'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
