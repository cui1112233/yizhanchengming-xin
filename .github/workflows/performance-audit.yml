name: performance-audit

on:
  push:
    branches:
      - test/performance-concurrency-capacity
  workflow_dispatch:

jobs:
  mysql-concurrency-probe:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: perf_audit
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Install Goose
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.24.3
      - name: Apply migrations
        run: goose -dir db/migrations mysql 'root:root@tcp(127.0.0.1:3306)/perf_audit?parseTime=true&multiStatements=true' up
      - name: Run Task 9 idempotency RED probe
        env:
          PERF_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/perf_audit?parseTime=true
        shell: bash
        run: |
          set +e
          go test ./internal/pipeline -run TestConcurrentCreateSameIntakeIsIdempotent -count=1 -v 2>&1 | tee /tmp/perf-red.log
          test_status=${PIPESTATUS[0]}
          while IFS= read -r line; do
            echo "::warning title=PERF_TASK9_IDEMPOTENCY_RED::$line"
          done < <(grep 'PERF_RED' /tmp/perf-red.log || true)
          if [ "$test_status" -eq 0 ]; then
            echo "::notice title=PERF_TASK9_IDEMPOTENCY_RED::Probe passed; re-check whether Task 9 idempotency entered main."
          else
            echo "::warning title=PERF_TASK9_IDEMPOTENCY_RED::Expected RED reproduced with exit code $test_status; Task 9.4.6 remains a blocker."
          fi
          exit 0
      - name: Run 10/50/100 MySQL and HTTP baseline
        env:
          PERF_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/perf_audit?parseTime=true
        shell: bash
        run: |
          set -o pipefail
          go test ./internal/perfaudit -run TestMySQLAndHTTPBaseline -count=1 -v 2>&1 | tee /tmp/perf-baseline.log
          while IFS= read -r line; do
            echo "::notice title=PERF_BASELINE::$line"
          done < <(grep 'PERF_BASELINE' /tmp/perf-baseline.log || true)
      - name: Run existing Go tests
        run: go test ./...
