name: qiantie-v88-review

# This stack is an isolated candidate only. Every host path, port, image and
# secret is supplied by the review env file; nothing here points at production.

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: qiantie_v88
      MYSQL_USER: qiantie
      MYSQL_PASSWORD: ${QIANTIE_V88_MYSQL_PASSWORD:?required}
      MYSQL_ROOT_PASSWORD: ${QIANTIE_V88_MYSQL_ROOT_PASSWORD:?required}
    volumes:
      - ${QIANTIE_V88_MYSQL_DATA_DIR:?required}:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [v88-review]
    restart: "no"

  redis:
    profiles: ["merge"]
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${QIANTIE_V88_REDIS_PASSWORD:-}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${QIANTIE_V88_REDIS_PASSWORD:-}"]
    volumes:
      - ${QIANTIE_V88_REDIS_DATA_DIR:-/tmp/qiantie-v88-review/redis-data}:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [v88-review]
    restart: "no"

  merge-worker:
    profiles: ["merge"]
    build:
      context: ./backend
      dockerfile: Dockerfile.merge-worker
    image: ${QIANTIE_V88_MERGE_WORKER_IMAGE:-qiantie-merge-worker:v88-review}
    environment:
      QIANTIE_MERGE_WORKER_LISTEN_ADDR: ":8790"
      QIANTIE_MERGE_WORKER_SECRET: ${QIANTIE_V88_MERGE_WORKER_SECRET:-}
      QIANTIE_MERGE_REDIS_URL: "redis://:${QIANTIE_V88_REDIS_PASSWORD:-}@redis:6379/0"
      QIANTIE_MERGE_REDIS_PREFIX: qiantie:v88-review:bf11:merge
      QIANTIE_MERGE_WORK_ROOT: /tmp/qiantie-merge
      QIANTIE_MERGE_TOS_ENDPOINT: ${QIANTIE_V88_MERGE_TOS_ENDPOINT:-}
      QIANTIE_MERGE_TOS_REGION: ${QIANTIE_V88_MERGE_TOS_REGION:-}
      QIANTIE_MERGE_TOS_BUCKET: ${QIANTIE_V88_MERGE_TOS_BUCKET:-}
      QIANTIE_MERGE_TOS_ACCESS_KEY: ${QIANTIE_V88_MERGE_TOS_ACCESS_KEY:-}
      QIANTIE_MERGE_TOS_SECRET_KEY: ${QIANTIE_V88_MERGE_TOS_SECRET_KEY:-}
      QIANTIE_MERGE_TOS_PUBLIC_BASE_URL: ${QIANTIE_V88_MERGE_TOS_PUBLIC_BASE_URL:-}
    depends_on:
      redis:
        condition: service_healthy
    expose: ["8790"]
    networks: [v88-review]
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${QIANTIE_V88_BACKEND_IMAGE:-qiantie-backend:v88-review}
    environment:
      QIANTIE_GO_LISTEN_ADDR: ":4000"
      QIANTIE_MYSQL_DSN: "qiantie:${QIANTIE_V88_MYSQL_PASSWORD:?required}@tcp(mysql:3306)/qiantie_v88?parseTime=true&multiStatements=true"
      QIANTIE_BRIDGE_SECRET: ${QIANTIE_V88_BRIDGE_SECRET:?required}
      QIANTIE_BATCH_FACTORY_V11_SLICE: ${QIANTIE_V88_SLICE:-4}
      QIANTIE_BATCH_FACTORY_V11_TEXT_ENDPOINT: ${QIANTIE_V88_TEXT_ENDPOINT:?required}
      QIANTIE_BATCH_FACTORY_V11_TEXT_API_KEY: ${QIANTIE_V88_TEXT_API_KEY:?required}
      QIANTIE_BATCH_FACTORY_V11_TEXT_MODEL: ${QIANTIE_V88_TEXT_MODEL:?required}
      QIANTIE_BATCH_FACTORY_V11_PRODUCTION_ENABLED: ${QIANTIE_V88_PRODUCTION_ENABLED:-1}
      QIANTIE_BATCH_FACTORY_V11_MERGE_ENABLED: ${QIANTIE_V88_MERGE_ENABLED:-0}
      QIANTIE_BATCH_FACTORY_V11_MERGE_ENDPOINT: ${QIANTIE_V88_MERGE_ENDPOINT:-http://merge-worker:8790/v1/merge}
      QIANTIE_BATCH_FACTORY_V11_MERGE_POLL_ENDPOINT: ${QIANTIE_V88_MERGE_POLL_ENDPOINT:-http://merge-worker:8790/v1/merge/{id}}
      QIANTIE_BATCH_FACTORY_V11_MERGE_API_KEY: ${QIANTIE_V88_MERGE_API_KEY:-}
      QIANTIE_BATCH_FACTORY_V11_121_ENABLED: ${QIANTIE_V88_121_ENABLED:-0}
      QIANTIE_BATCH_FACTORY_V11_121_ENDPOINT: ${QIANTIE_V88_121_ENDPOINT:-}
      QIANTIE_BATCH_FACTORY_V11_121_API_KEY: ${QIANTIE_V88_121_API_KEY:-}
      QIANTIE_BATCH_FACTORY_V11_YADI_ENABLED: ${QIANTIE_V88_YADI_ENABLED:-0}
      QIANTIE_BATCH_FACTORY_V11_YADI_ENDPOINT: ${QIANTIE_V88_YADI_ENDPOINT:-}
      QIANTIE_BATCH_FACTORY_V11_YADI_API_KEY: ${QIANTIE_V88_YADI_API_KEY:-}
      QIANTIE_BATCH_FACTORY_V11_CREDENTIALS_KEY: ${QIANTIE_V88_EXTERNAL_CREDENTIALS_KEY:-}
      QIANTIE_LOCAL_EXECUTOR_ARTIFACT_DIR: /data/local-executor-artifacts
      QIANTIE_LOCAL_EXECUTOR_PUBLIC_BASE_URL: ${QIANTIE_V88_PUBLIC_BASE_URL:?required}
    volumes:
      - ${QIANTIE_V88_ARTIFACT_DATA_DIR:?required}:/data/local-executor-artifacts
    depends_on:
      mysql:
        condition: service_healthy
    expose: ["4000"]
    healthcheck:
      test: ["CMD", "/qiantie", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [v88-review]
    restart: "no"

  platform:
    # The public application runtime is Go. Keep the historical Node shell
    # available only for an explicit rollback/audit profile.
    profiles: ["node-legacy"]
    build:
      context: .
      dockerfile: Dockerfile
    image: ${QIANTIE_V88_PLATFORM_IMAGE:-qiantie-platform:v88-review}
    environment:
      QIANTIE_NODE_PORT: "18081"
      QIANTIE_GO_BASE_URL: http://backend:4000
      QIANTIE_BRIDGE_SECRET: ${QIANTIE_V88_BRIDGE_SECRET:?required}
      QIANTIE_AUTODL_H3_API_KEY: ${QIANTIE_V88_AUTODL_H3_API_KEY:-}
      QIANTIE_121_BROWSER_WORKER_URL: http://novel-fetch-121-worker:8787
      QIANTIE_121_WORKER_SECRET: ${QIANTIE_V88_121_WORKER_SECRET:?required}
      QIANTIE_121_CREDENTIAL_SECRET: ${QIANTIE_V88_CREDENTIAL_SECRET:?required}
    ports:
      - "127.0.0.1:${QIANTIE_V88_HOST_PORT:-13188}:18081"
    volumes:
      - ${QIANTIE_V88_DATA_DIR:?required}:/app/data
    depends_on:
      backend:
        condition: service_healthy
    networks: [v88-review]
    restart: "no"

  novel-fetch-121-worker:
    profiles: ["full"]
    build:
      context: ./services/121-browser-worker
      dockerfile: Dockerfile
    image: ${QIANTIE_V88_WORKER_IMAGE:-qiantie-121-browser-worker:v88-review}
    environment:
      HOST: 0.0.0.0
      PORT: "8787"
      QIANTIE_121_WORKER_SECRET: ${QIANTIE_V88_121_WORKER_SECRET:?required}
      QIANTIE_121_STORAGE_STATE_SECRET: ${QIANTIE_V88_121_STORAGE_STATE_SECRET:?required}
      QIANTIE_121_HEADED_ENABLED: "1"
      QIANTIE_121_SESSION_DIR: /data/sessions
    expose: ["8787"]
    volumes:
      - ${QIANTIE_V88_WORKER_DATA_DIR:?required}:/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get({host:'127.0.0.1',port:8787,path:'/healthz',headers:{'x-qiantie-internal-secret':process.env.QIANTIE_121_WORKER_SECRET}},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [v88-review]
    restart: "no"

networks:
  v88-review:
    driver: bridge
