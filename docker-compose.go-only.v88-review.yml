name: qiantie-v88-go-only-review

# Apply together with docker-compose.v88-review.yml.  This override makes the
# Go binary the only public entry point: it embeds the web UI and owns the API.
# The old Node platform remains available only when the explicit
# `node-legacy` profile is selected in the base stack.

services:
  backend:
    ports:
      - "127.0.0.1:${QIANTIE_V88_HOST_PORT:-13188}:4000"

  platform:
    profiles: ["node-legacy"]
