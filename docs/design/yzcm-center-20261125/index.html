<script>
let page=location.hash.slice(1)||'member', role='admin', usageTab='overview', modelKind='全部', activeState='empty';
const $=s=>document.querySelector(s); const badge=(s,t='good')=>`<span class="badge ${t}">${s}</span>`;
const btn=(s,a,cl='')=>`<button class="${cl}" onclick="${a}">${s}</button>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((x,i)=>`<td ${i===r.length-1?'class="right"':''}>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
const paginate=(count)=>`<div class="tablefoot between"><span>共 ${count} 条 · 当前为设计演示</span><div class="pager"><button onclick="toast('已在第一页')">上一页</button><button class="on" onclick="toast('当前为第 1 页')">1</button><button onclick="toast('设计稿仅展示第一页示例')">下一页</button></div></div>`;
function go(p){page=p;location.hash=p;render();window.scrollTo(0,0)}
function member(){if(role==='member'||page==='personal')return personal();return head('会员中心','管理团队余额、充值与成员使用额度',btn('充值记录',"go('recharge')")+btn('刷新余额',"toast('演示：余额已刷新，示例数据未连接真实账户')"))+

function toast(s){$('#toast').textContent=s;$('#toast').classList.remove('hidden');clearTimeout(window.toasttimer);window.toasttimer=setTimeout(()=>$('#toast').classList.add('hidden'),4200)}
async function copyText(s){try{await navigator.clipboard.writeText(s);toast('已复制演示请求编号')}catch{toast('演示编号：'+s)}}
function drawTrend(){const cv=$('#trend');if(!cv)return;const dpr=window.devicePixelRatio||1,w=cv.clientWidth,h=215;cv.width=w*dpr;cv.height=h*dpr;const c=cv.getContext('2d');c.scale(dpr,dpr);const left=34,right=10,top=20,bottom=29,gw=w-left-right,gh=h-top-bottom;const values=[15,22,18,32,25,17,30,24,39,29,41,34,25,28.42];c.font='10px Microsoft YaHei';for(let i=0;i<4;i++){const y=top+gh*i/3;c.strokeStyle='#33434d';c.beginPath();c.moveTo(left,y);c.lineTo(w-right,y);c.stroke();c.fillStyle='#8fa6b1';c.fillText(String(45-i*15),2,y+3)}const points=values.map((v,i)=>[left+i*gw/13,top+gh*(1-v/45)]);c.beginPath();points.forEach((p,i)=>i?c.lineTo(...p):c.moveTo(...p));c.lineTo(w-right,h-bottom);c.lineTo(left,h-bottom);c.closePath();c.fillStyle='#70dec211';c.fill();c.beginPath();points.forEach((p,i)=>i?c.lineTo(...p):c.moveTo(...p));c.strokeStyle='#70dec2';c.lineWidth=2;c.stroke();for(let i=0;i<14;i+=3){c.fillStyle='#8fa6b1';c.fillText('11/'+(12+i),left+i*gw/13-12,h-7)}const p=points.at(-1);c.beginPath();c.arc(p[0],p[1],4,0,Math.PI*2);c.fillStyle='#70dec2';c.fill()}
function render(){closeModal();$('#who').textContent=role==='admin'?'晟铭创作团队':'小王';$('#identityRole').textContent=role==='admin'?'团队管理员':'团队成员';document.querySelectorAll('[data-nav]').forEach(x=>{x.classList.toggle('active',x.dataset.nav===navOf(page));x.classList.toggle('hidden',role==='member'&&['accounts','catalog','budgets','models'].includes(x.dataset.nav));});const views={member,personal,recharge,budgets,usage:usageShell,bills:usageShell,production:usageShell,models:modelsPage,presets,accounts,catalog,map,states};if(role==='member'&&['accounts','catalog','budgets','recharge','models','presets'].includes(page))$('#main').innerHTML=head('无权查看','此页面仅团队管理员可访问')+`<section class="panel empty"><strong>请联系团队管理员</strong><p>成员可以查看自己的额度、用量和制作记录。</p>${btn('返回我的会员中心',"go('member')",'primary')}</section>`;else $('#main').innerHTML=(views[page]||map)();if(page==='bills')filterCalls();if(page==='usage')requestAnimationFrame(drawTrend);document.title='一战晟铭设计稿 · '+(scenes.find(s=>s[0]===page)?.[2]||'账户与用量')}
$('#role').onchange=e=>{role=e.target.value;render()};window.addEventListener('hashchange',()=>{page=location.hash.slice(1)||'member';render()});window.addEventListener('resize',drawTrend);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});render();
</script></body></html>
